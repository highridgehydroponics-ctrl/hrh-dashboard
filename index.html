<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRH Morning Rundown</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #eef0f5; color: #222; padding: 20px; }

  /* ── HEADER ── */
  .header-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 1.35rem; font-weight: 700; color: #111; display: flex; align-items: center; gap: 8px; }
  .date-badge { background: #dbe8ff; color: #1a56cc; font-size: 0.82rem;
    font-weight: 600; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
  .header-btns { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .warn-badge { background: #fff8e1; color: #b45309; font-size: 0.78rem;
    padding: 4px 10px; border-radius: 6px; border: 1px solid #fde68a; }
  button { border: none; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 0.83rem; font-weight: 500; }
  #showAllBtn  { background: #e8eaf0; color: #555; display: none; }
  #showAllBtn:hover { background: #d8dae0; }
  #refreshBtn  { background: #22c55e; color: #fff; display: flex; align-items: center; gap: 5px; }
  #refreshBtn:hover { background: #16a34a; }
  #refreshBtn:disabled { background: #9ca3af; cursor: default; }
  #printBtn    { background: #e8eaf0; color: #555; }
  #printBtn:hover { background: #d8dae0; }

  /* ── DATE NAV ── */
  .date-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
  .date-nav-btn { background: #fff; border: 1px solid #dde0e8; color: #555;
    padding: 5px 11px; font-size: 0.9rem; border-radius: 6px; }
  .date-nav-btn:hover { background: #f0f2f7; }
  #dateDisplay { font-size: 0.9rem; font-weight: 600; color: #333;
    min-width: 150px; text-align: center; }
  #todayBtn { background: #dbe8ff; color: #1a56cc; font-size: 0.75rem;
    padding: 4px 10px; border-radius: 6px; border: none; display: none; }
  #todayBtn:hover { background: #c7d8ff; }

  /* ── KPI CARDS ── */
  .kpi-bar { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi { background: #fff; border-radius: 10px; padding: 14px 18px; flex: 1; min-width: 110px;
    cursor: pointer; user-select: none; border: 2px solid transparent;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    transition: border-color .15s, box-shadow .15s, transform .1s; }
  .kpi:hover { border-color: #bbc6e0; box-shadow: 0 3px 10px rgba(0,0,0,.1); transform: translateY(-1px); }
  .kpi.active { border-color: #1a56cc; box-shadow: 0 3px 12px rgba(26,86,204,.2); }
  .kpi-val   { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .kpi-label { font-size: 0.7rem; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: #888; margin-top: 4px; }
  .kpi-hint  { font-size: 0.65rem; color: #bbb; margin-top: 3px; }
  /* KPI colors */
  .kpi-green  .kpi-val { color: #16a34a; }
  .kpi-orange .kpi-val { color: #ea580c; }
  .kpi-blue   .kpi-val { color: #1d4ed8; }
  .kpi-purple .kpi-val { color: #7c3aed; }

  /* ── SECTIONS ── */
  .section { background: #fff; border-radius: 10px; padding: 18px 20px;
    margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
  .section-title { font-size: 0.95rem; font-weight: 700; color: #111;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sec-badge { background: #f0f2f7; color: #1a56cc; font-size: 0.72rem;
    padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .sec-sub { color: #999; font-size: 0.75rem; font-weight: 400; }

  /* ── TABLES ── */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 400px; }
  thead tr { border-bottom: 2px solid #eef0f5; }
  th { text-align: left; color: #999; font-size: 0.72rem; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f2f4f8; vertical-align: middle; color: #333; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f8f9fc; }

  /* Pack-out specific */
  .qty-badge { display: inline-block; background: #fff7ed; color: #ea580c;
    font-weight: 700; font-size: 0.82rem; padding: 1px 8px; border-radius: 8px; min-width: 28px; text-align: center; }
  .customer-col { color: #888; }
  .status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
  .dot-upcoming  { background: #22c55e; }
  .dot-packed    { background: #94a3b8; }
  .dot-cancelled { background: #ef4444; }

  /* Stop num */
  .stop-num { display: inline-block; background: #1d4ed8; color: #fff;
    font-size: 0.7rem; padding: 2px 7px; border-radius: 8px; font-weight: 600; }

  /* Subtotal row */
  .subtotal-row td { color: #aaa; font-style: italic; font-size: 0.8rem;
    border-top: 1px solid #eef0f5; }
  .subtotal-val { color: #333; font-weight: 600; font-style: normal; }

  /* Cancelled toggle */
  .cancelled-toggle { background: none; border: none; color: #aaa; font-size: 0.8rem;
    cursor: pointer; padding: 8px 0; display: flex; align-items: center; gap: 6px; }
  .cancelled-toggle:hover { color: #666; }
  .cancelled-section { border-top: 1px solid #eef0f5; padding-top: 8px; margin-top: 8px; }
  tr.row-cancelled td { opacity: 0.4; text-decoration: line-through; }

  /* Harvest yield */
  .yield-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .yield-input { width: 48px; background: #f0f4ff; border: 1px solid #a5b4fc;
    border-radius: 4px; color: #1d4ed8; font-size: 0.84rem; padding: 2px 5px; text-align: center; }
  .yield-input.yield-oz { width: 60px; background: #f0fff4; border-color: #86efac; color: #16a34a; }
  .yield-input:focus { outline: none; border-color: #1d4ed8; }
  .yield-input.yield-oz:focus { border-color: #16a34a; }
  .yield-of { color: #aaa; font-size: 0.8rem; white-space: nowrap; }
  .yield-bar-wrap { width: 50px; background: #e8eaf0; border-radius: 4px; height: 5px; overflow: hidden; flex-shrink: 0; }
  .yield-bar { height: 100%; background: #1d4ed8; border-radius: 4px; transition: width .3s; }

  /* Container group header (M1 / M2) */
  .container-group { font-size: 0.8rem; font-weight: 700; color: #fff;
    background: #1d4ed8; padding: 4px 12px; border-radius: 6px;
    margin: 14px 0 6px; display: inline-block; }
  .container-group:first-child { margin-top: 0; }
  /* Harvest subsection label */
  .harvest-sub-label { font-size: 0.78rem; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: #888; margin: 14px 0 6px; padding-bottom: 4px;
    border-bottom: 1px solid #eef0f5; }
  .harvest-sub-label:first-child { margin-top: 0; }
  .harvest-sub-label.pending-lbl { color: #ea580c; }
  .harvest-sub-label.done-lbl    { color: #16a34a; }

  /* Date groups */
  .date-group { font-weight: 600; color: #aaa; font-size: 0.78rem;
    padding: 8px 0 4px; border-top: 1px solid #eef0f5; margin-top: 8px; }
  .date-group:first-child { margin-top: 0; border-top: none; }

  /* Oz */
  .oz-total { font-weight: 600; }

  /* Status pill (harvest/plant sections) */
  .pill { display: inline-block; font-size: 0.7rem; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
  .pill-packed    { background: #f1f5f9; color: #64748b; }
  .pill-upcoming  { background: #dcfce7; color: #16a34a; }
  .pill-cancelled { background: #fee2e2; color: #dc2626; }

  /* Invoice */
  .inv-yes { color: #16a34a; font-weight: 600; }
  .inv-no  { color: #ccc; }

  /* Harvest save button */
  .save-btn { font-size: 0.72rem; padding: 3px 10px; border-radius: 5px;
    background: #1d4ed8; color: #fff; border: none; cursor: pointer; white-space: nowrap; }
  .save-btn:hover { background: #1e40af; }
  .save-btn:disabled { background: #93c5fd; cursor: default; }
  .save-btn.saved    { background: #16a34a; }
  .save-btn.err      { background: #dc2626; }

  .empty { color: #bbb; font-size: 0.85rem; padding: 12px 0; }

  /* Loading / error */
  #loading   { text-align: center; padding: 80px; color: #888; font-size: 1rem; }
  #error-msg { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
    border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: none; }
  #content   { display: none; }

  /* Print */
  @media print {
    body { background: #fff; padding: 8px; font-size: 11px; }
    .header-btns, .date-nav, .kpi-hint, .cancelled-toggle,
    #showAllBtn, #printBtn { display: none !important; }
    .section { box-shadow: none; border: 1px solid #ddd; padding: 10px; break-inside: avoid; }
    .kpi { box-shadow: none; border: 1px solid #ddd; }
    .tbl-wrap { overflow: visible; }
  }
</style>
</head>
<body>

<div id="loading">⏳ Loading fresh data from AppSheet…</div>
<div id="error-msg"></div>

<div id="content">
  <div class="header-row">
    <h1>🌱 HRH Morning Rundown</h1>
    <span class="date-badge" id="dateBadge"></span>
    <div class="header-btns">
      <button id="showAllBtn" onclick="showAll()">← Show All</button>
      <span id="warnBadge" class="warn-badge" style="display:none">⚠️ Live fetch failed — showing cached data</span>
      <button id="printBtn" onclick="window.print()">🖨 Print</button>
      <button id="refreshBtn" onclick="loadData()">⚡ Refresh</button>
    </div>
  </div>

  <div class="date-nav">
    <button class="date-nav-btn" onclick="shiftDate(-1)">←</button>
    <span id="dateDisplay"></span>
    <button class="date-nav-btn" onclick="shiftDate(1)">→</button>
    <button id="todayBtn" onclick="goToday()">Today</button>
  </div>

  <div class="kpi-bar" id="kpiBar"></div>

  <div class="section" id="sec-packout">
    <div class="section-title">
      📦 Pack Out for Today's Deliveries
      <span class="sec-badge" id="badge-stops"></span>
      <span class="sec-sub" id="packout-sub"></span>
    </div>
    <div id="packout-body"></div>
  </div>

  <div class="section" id="sec-stops">
    <div class="section-title">
      📋 Stops Today
      <span class="sec-badge" id="badge-stops-today"></span>
    </div>
    <div id="stops-today-body"></div>
  </div>

  <div class="section" id="sec-harvest">
    <div class="section-title">
      ✂️ Harvested Today
      <span class="sec-badge" id="badge-harvest"></span>
    </div>
    <div id="harvest-body"></div>
  </div>

  <div class="section" id="sec-labels">
    <div class="section-title">
      🏷️ Labels to Print
      <span class="sec-badge" id="badge-labels"></span>
    </div>
    <div id="labels-body"></div>
  </div>

  <div class="section" id="sec-oz">
    <div class="section-title">
      ⚖️ Oz Needed by Variety
      <span class="sec-sub">(selected day + next day)</span>
    </div>
    <div id="oz-body"></div>
  </div>

  <div class="section" id="sec-plant">
    <div class="section-title">
      🌱 Plant Today
      <span class="sec-badge" id="badge-plant"></span>
    </div>
    <div id="plant-body"></div>
  </div>

  <div class="section" id="sec-tomorrow">
    <div class="section-title">
      📋 Tomorrow's Deliveries
      <span class="sec-badge" id="badge-tmr"></span>
    </div>
    <div id="tomorrow-body"></div>
  </div>
</div>

<script>
const ORDERS = { appId: 'bea55701-8006-4581-a791-19a75092943f', apiKey: 'V2-f4zl4-pDmwB-IZ9zh-t6ari-vPhJu-FmAwJ-WQ46U-LIUqO' };
const GR     = { appId: 'fe7f55b7-a021-4f49-a9cb-c5528e8de84e', apiKey: 'V2-yQryr-d6cw2-Th5B2-TE8Na-aNKjx-YAnBI-K7AzT-iVWEh' };
const GC     = { appId: '0ddb09d1-5e1c-434e-9e6e-ce46a54cd628', apiKey: 'V2-tSZCd-mCmE9-JdcyR-TIS5Q-grSxm-EKYUM-EkcIV-0CHoS' };

const ALL_SECTIONS = ['sec-packout','sec-stops','sec-harvest','sec-labels','sec-oz','sec-plant','sec-tomorrow'];
let activeFilter       = null;
let __store            = null;
let __viewDate         = new Date();
const __harvestOverrides = {}; // keyed by batch id: { trays, yield }

function getContainer(rackStr) {
  if (!rackStr) return 'Other';
  const m = (rackStr||'').match(/^(M\d)/i);
  return m ? m[1].toUpperCase() : 'Other';
}

function setHarvestOverride(id, field, value, total, barId) {
  if (!__harvestOverrides[id]) __harvestOverrides[id] = {};
  const num = parseFloat(value) || 0;
  __harvestOverrides[id][field] = num;
  if (barId && total > 0) {
    const bar = document.getElementById(barId);
    const trays = field === 'trays' ? num
      : (__harvestOverrides[id].trays !== undefined ? __harvestOverrides[id].trays : 0);
    if (bar) bar.style.width = Math.min(100, Math.round(trays/total*100)) + '%';
  }
  // Mark the row's save button as dirty
  const btn = document.getElementById('sbtn_' + id);
  if (btn) { btn.textContent = 'Save'; btn.className = 'save-btn'; }
}

function toggleOzRow(id) {
  const el = document.getElementById(id);
  const chev = document.getElementById('chev_' + id);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'table-row';
  if (chev) chev.textContent = open ? '▶' : '▼';
}

async function saveHarvestRow(batchId) {
  const btn = document.getElementById('sbtn_' + batchId);
  const ov  = __harvestOverrides[batchId] || {};
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  // Read current input values directly in case override wasn't set yet
  const trayInput  = document.getElementById('hi_trays_' + batchId);
  const yieldInput = document.getElementById('hi_yield_' + batchId);
  const trays = trayInput  ? (parseInt(trayInput.value)   || 0) : (ov.trays  || 0);
  const yld   = yieldInput ? (parseFloat(yieldInput.value)|| 0) : (ov.yield  || 0);

  const YIELD_FIELD = 'actual_yield';

  try {
    const url = `https://api.appsheet.com/api/v2/apps/${GC.appId}/tables/batch/Action`;
    const body = {
      Action: 'Edit',
      Properties: {},
      Rows: [{ id: batchId, number_trays_harvested: String(trays), [YIELD_FIELD]: String(yld) }]
    };
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'ApplicationAccessKey': GC.apiKey, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (btn) { btn.textContent = '✓ Saved'; btn.className = 'save-btn saved'; btn.disabled = false; }
  } catch(e) {
    if (btn) { btn.textContent = '✗ Error'; btn.className = 'save-btn err'; btn.disabled = false; }
    console.error('saveHarvestRow error:', e);
  }
}

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
function fmt(d) {
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
}
function fmtLong(d) {
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}
function fmtBadge(d) {
  return d.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function isToday(d) {
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}

function shiftDate(n) { __viewDate = addDays(__viewDate, n); renderForDate(__viewDate); }
function goToday()    { __viewDate = new Date(); renderForDate(__viewDate); }

// ── FILTER ────────────────────────────────────────────────────────────────────
function filterSection(card) {
  const target = card.dataset.target;
  if (activeFilter === target) { showAll(); return; }
  activeFilter = target;
  document.querySelectorAll('.kpi').forEach(k => k.classList.remove('active'));
  card.classList.add('active');
  ALL_SECTIONS.forEach(id => {
    document.getElementById(id).style.display = target.split(',').includes(id) ? 'block' : 'none';
  });
  document.getElementById('showAllBtn').style.display = 'inline-block';
}
function showAll() {
  activeFilter = null;
  document.querySelectorAll('.kpi').forEach(k => k.classList.remove('active'));
  ALL_SECTIONS.forEach(id => { document.getElementById(id).style.display = 'block'; });
  document.getElementById('showAllBtn').style.display = 'none';
}

// ── APPSHEET ──────────────────────────────────────────────────────────────────
async function appFetch(creds, table) {
  const url = `https://api.appsheet.com/api/v2/apps/${creds.appId}/tables/${encodeURIComponent(table)}/Action`;
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'ApplicationAccessKey': creds.apiKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ Action: 'Find', Properties: {}, Rows: [] })
  });
  if (!r.ok) throw new Error(`AppSheet error on "${table}": ${r.status}`);
  const t = await r.text();
  return t.trim() ? JSON.parse(t) : [];
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function simplifyRack(s) {
  if (!s) return '—';
  return s.split(',').map(p =>
    p.trim().replace(/^[^-]+-/, '').replace(/\(\d+\)$/, '').trim()
  ).filter(Boolean).join(', ') || '—';
}
function statusPill(s) {
  if (!s) return '';
  const l = s.toLowerCase();
  if (l.includes('packed'))  return `<span class="pill pill-packed">Packed</span>`;
  if (l.includes('cancel'))  return `<span class="pill pill-cancelled">Cancelled</span>`;
  return `<span class="pill pill-upcoming">Upcoming</span>`;
}
function statusDot(s) {
  if (!s) return '';
  const l = s.toLowerCase();
  if (l.includes('packed'))  return `<span class="status-dot dot-packed"  title="Packed Out"></span>`;
  if (l.includes('cancel'))  return `<span class="status-dot dot-cancelled" title="Cancelled"></span>`;
  return `<span class="status-dot dot-upcoming" title="Upcoming"></span>`;
}
function itemStatusText(s) {
  if (!s) return '—';
  const l = s.toLowerCase();
  let color = '#16a34a';
  if (l.includes('packed')) color = '#64748b';
  if (l.includes('cancel')) color = '#dc2626';
  return `<span style="font-size:0.79rem;color:${color};font-weight:500">${s}</span>`;
}
function yieldCell(b) {
  const total = parseInt(b.number_of_trays)||0;
  const done  = parseInt(b.number_trays_harvested)||0;
  const pct   = total>0 ? Math.min(100, Math.round(done/total*100)) : 0;
  return `<div class="yield-wrap">
    <input class="yield-input" id="yld_${b.id}" type="number" min="0" max="${total}" value="${done}"
      onchange="updateYield(this,${total},'bar_${b.id}')" title="Trays harvested">
    <span class="yield-of">/ ${total}</span>
    <div class="yield-bar-wrap"><div class="yield-bar" id="bar_${b.id}" style="width:${pct}%"></div></div>
  </div>`;
}
function updateYield(input, total, barId) {
  const v = Math.min(total, Math.max(0, parseInt(input.value)||0));
  input.value = v;
  const bar = document.getElementById(barId);
  if (bar) bar.style.width = (total>0 ? Math.round(v/total*100) : 0) + '%';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderForDate(viewDate) {
  if (!__store) return;
  const { sliceAll, ordersAll, detailAll, batchAll, varMap, clientPrefs, orderMap } = __store;

  const todayStr = fmt(viewDate);
  const tmrStr   = fmt(addDays(viewDate, 1));

  // Update date displays
  document.getElementById('dateBadge').textContent   = fmtBadge(viewDate);
  document.getElementById('dateDisplay').textContent  = fmtLong(viewDate);
  document.getElementById('todayBtn').style.display   = isToday(viewDate) ? 'none' : 'inline-block';

  // Filter data
  const todayOrders  = ordersAll.filter(o => o.fulfillment_date === todayStr);
  const todayDetails = detailAll.filter(d => d.fulfillment_date === todayStr);
  const tmrOrders    = ordersAll.filter(o => o.fulfillment_date === tmrStr);
  const tmrDetails   = detailAll.filter(d => d.fulfillment_date === tmrStr);
  const labelsToday  = sliceAll.filter(r => r.fulfillment_date === todayStr);
  const labelsTmr    = sliceAll.filter(r => r.fulfillment_date === tmrStr);
  const plantings    = batchAll.filter(b => (b.optimal_planting_date||'').trim() === todayStr);

  // Pack-out: ONLY upcoming items (not packed out, not cancelled)
  const upcomingItems = todayDetails.filter(d => {
    const s = (d.status||'').toLowerCase();
    return s.includes('upcoming') && !s.includes('cancel');
  });
  const activeOrders    = todayOrders.filter(o => !o.status.toLowerCase().includes('cancel'));
  const cancelledOrders = todayOrders.filter(o =>  o.status.toLowerCase().includes('cancel'));

  // ── KPI BAR ──
  const totalLabels = labelsToday.length + labelsTmr.length;
  // Microgreen-only filter (no lettuce, no mixes)
  function isMicrogreenBatch(b) {
    const v = varMap[b.variety];
    if (!v) return true;
    if (v['mix?'] === 'Y') return false;
    if (v.reserve_1 === 'Lettuce') return false;
    const nm = (v.name||'').toLowerCase();
    return !nm.includes('lettuce') && !nm.includes('hydro salanova') && !nm.includes('little gem');
  }
  // All harvest batches for today (microgreens only)
  const allHarvestToday = batchAll.filter(b =>
    (b.optimal_harvest_date||'').trim() === todayStr && isMicrogreenBatch(b)
  );
  // Pending = 'Being Harvested' status but trays not yet recorded (rack is assigned at this status)
  const pendingHarvests   = allHarvestToday.filter(b =>
    (b.status_name||'').toLowerCase().includes('being harvest') &&
    (parseInt(b.number_trays_harvested)||0) === 0
  );
  const completedHarvests = allHarvestToday.filter(b => (parseInt(b.number_trays_harvested)||0) > 0);
  // Plant KPI = sum of trays (non-mix, non-lettuce)
  const nonLettuceNonMixForKpi = plantings.filter(b => {
    const v = varMap[b.variety];
    if (!v) return true;
    if (v['mix?'] === 'Y') return false;
    if (v.reserve_1 === 'Lettuce') return false;
    const nm = (v.name||'').toLowerCase();
    return !nm.includes('lettuce') && !nm.includes('hydro salanova') && !nm.includes('little gem');
  });
  const plantTraySum = nonLettuceNonMixForKpi.reduce((sum, b) => sum + (parseInt(b.number_of_trays)||0), 0);
  // Build oz-by-variety map with per-order detail for expandable rows
  const ozByVariety = {};
  [...todayDetails, ...tmrDetails].forEach(d => {
    const v = varMap[d.variety];
    if (!v || v['mix?'] === 'Y') return;
    const oz = parseFloat(d.total_ounces)||0;
    if (!oz) return;
    const vname = v.name || d.variety;
    if (!ozByVariety[vname]) ozByVariety[vname] = { total: 0, items: [] };
    ozByVariety[vname].total += oz;
    ozByVariety[vname].items.push({
      customer: d.client_name || '—',
      product:  d.product_name || '—',
      oz,
      date: d.fulfillment_date
    });
  });
  const ozEntries = Object.entries(ozByVariety).sort((a,b) => b[1].total - a[1].total);

  const kpiDefs = [
    { val: activeOrders.length,    label: 'Stops Today',         target: 'sec-stops',   cls: 'kpi-green'  },
    { val: upcomingItems.length,   label: 'Items to Pack',        target: 'sec-packout', cls: 'kpi-orange' },
    { val: allHarvestToday.length, label: 'Harvest Today',        target: 'sec-harvest', cls: 'kpi-blue'   },
    { val: plantTraySum,           label: 'Trays to Plant',       target: 'sec-plant',   cls: 'kpi-blue'   },
    { val: totalLabels,            label: 'Labels to Print',      target: 'sec-labels',  cls: 'kpi-orange' },
    { val: ozEntries.length,       label: 'Allocation Details',   target: 'sec-oz',      cls: 'kpi-purple' },
    { val: tmrOrders.length,       label: 'Deliveries Tomorrow',  target: 'sec-tomorrow',cls: 'kpi-purple' },
  ];
  document.getElementById('kpiBar').innerHTML = kpiDefs.map(k =>
    `<div class="kpi ${k.cls}${activeFilter===k.target?' active':''}"
      data-target="${k.target}" onclick="filterSection(this)">
      <div class="kpi-val">${k.val}</div>
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-hint">click to focus</div>
    </div>`
  ).join('');

  // ── PACK-OUT (upcoming items only, sorted by stop) ──
  document.getElementById('badge-stops').textContent = upcomingItems.length;
  document.getElementById('packout-sub').textContent =
    `Upcoming items only · sorted by stop`;

  const sortedOrders = [...activeOrders].sort((a,b) =>
    (parseInt(a.stop_number)||9999) - (parseInt(b.stop_number)||9999)
  );

  const buildPackRows = (orders, details, isCancelled) => {
    let rows = '';
    orders.forEach(ord => {
      const prefs   = clientPrefs[ord.client_name] || {};
      const invTxt  = prefs.bring_invoice === 'Y'
        ? '<span class="inv-yes">Yes</span>' : '<span class="inv-no">No</span>';
      const stopCell = ord.stop_number ? `<span class="stop-num">${ord.stop_number}</span>` : '—';
      // For pack-out: only show upcoming items per order
      const items = isCancelled
        ? details.filter(d => d.order === ord.id)
        : details.filter(d => d.order === ord.id && (d.status||'').toLowerCase().includes('upcoming'));
      const rowCls = isCancelled ? ' class="row-cancelled"' : '';
      if (!items.length) return; // skip orders with no matching items
      let stopTotal = 0;
      items.forEach((it, i) => {
        const lineTotal = parseFloat(it.total_price)||0;
        stopTotal += lineTotal;
        rows += `<tr${rowCls}>
          <td>${it.product_name||'—'}</td>
          <td><span class="qty-badge">${it.quantity_boxes||0}</span></td>
          <td class="customer-col">${ord.client_name}</td>
          <td>${statusDot(it.status)}</td>
        </tr>`;
      });
    });
    return rows;
  };

  const activeRows = buildPackRows(sortedOrders, todayDetails, false);
  let packHtml = '';
  if (!activeRows) {
    packHtml = '<div class="empty">No upcoming items to pack for this date.</div>';
  } else {
    packHtml = `<div class="tbl-wrap"><table>
      <thead><tr>
        <th>Product</th><th>Total Qty</th><th>Customer</th><th>Status</th>
      </tr></thead>
      <tbody>${activeRows}</tbody>
    </table></div>`;
    if (cancelledOrders.length) {
      const cancelRows = buildPackRows(cancelledOrders, todayDetails, true);
      if (cancelRows) {
        packHtml += `<div class="cancelled-section">
          <button class="cancelled-toggle" onclick="toggleCancelled()">
            <span id="cancelChevron">▶</span>
            ${cancelledOrders.length} cancelled order${cancelledOrders.length>1?'s':''}
          </button>
          <div id="cancelledBody" style="display:none">
            <div class="tbl-wrap"><table>
              <thead><tr><th>Product</th><th>Total Qty</th><th>Customer</th><th>Status</th></tr></thead>
              <tbody>${cancelRows}</tbody>
            </table></div>
          </div>
        </div>`;
      }
    }
  }
  document.getElementById('packout-body').innerHTML = packHtml;

  // ── STOPS TODAY (full layout like Tomorrow) ──
  document.getElementById('badge-stops-today').textContent = activeOrders.length;
  if (!activeOrders.length) {
    document.getElementById('stops-today-body').innerHTML = '<div class="empty">No stops for this date.</div>';
  } else {
    let st = `<div class="tbl-wrap"><table>
      <thead><tr>
        <th>Stop #</th><th>Customer</th><th>Product</th><th>Item Status</th>
        <th>Qty</th><th>Oz</th><th>Unit $</th><th>Total $</th><th>Order Status</th><th>Invoice</th>
      </tr></thead><tbody>`;
    sortedOrders.forEach(ord => {
      const prefs  = clientPrefs[ord.client_name]||{};
      const invTxt = prefs.bring_invoice === 'Y'
        ? '<span class="inv-yes">Yes</span>' : '<span class="inv-no">No</span>';
      const stopCell = ord.stop_number ? `<span class="stop-num">${ord.stop_number}</span>` : '—';
      const items = todayDetails.filter(d => d.order === ord.id);
      let stopTotal = 0;
      if (!items.length) {
        st += `<tr><td>${stopCell}</td><td>${ord.client_name}</td>
          <td colspan="6" class="empty">No items</td>
          <td>${statusPill(ord.status)}</td><td>${invTxt}</td></tr>`;
      } else {
        items.forEach((it, i) => {
          const lt = parseFloat(it.total_price)||0; stopTotal += lt;
          st += `<tr>
            <td>${i===0?stopCell:''}</td>
            <td class="customer-col" style="font-weight:${i===0?'600':'400'};color:${i===0?'#333':'#bbb'}">${i===0?ord.client_name:''}</td>
            <td>${it.product_name||'—'}</td>
            <td>${itemStatusText(it.status)}</td>
            <td><span class="qty-badge">${it.quantity_boxes||0}</span></td>
            <td>${it.total_ounces||0}</td>
            <td>${it.unit_price?'$'+parseFloat(it.unit_price).toFixed(2):'—'}</td>
            <td>${lt?'$'+lt.toFixed(2):'—'}</td>
            <td>${i===0?statusPill(ord.status):''}</td>
            <td>${i===0?invTxt:''}</td>
          </tr>`;
        });
        if (stopTotal>0) {
          st += `<tr class="subtotal-row">
            <td colspan="7" style="text-align:right">Stop subtotal</td>
            <td class="subtotal-val">$${stopTotal.toFixed(2)}</td>
            <td colspan="2"></td>
          </tr>`;
        }
      }
    });
    document.getElementById('stops-today-body').innerHTML = st + '</tbody></table></div>';
  }

  // ── HARVEST TODAY (pending + completed, grouped by M1/M2) ──
  document.getElementById('badge-harvest').textContent = allHarvestToday.length;

  function buildHarvestTable(batches) {
    if (!batches.length) return '<div class="empty" style="padding:8px 0">None</div>';
    // Group by container (M1, M2, Other)
    const groups = {};
    batches.forEach(b => {
      const c = getContainer(b.rack);
      if (!groups[c]) groups[c] = [];
      groups[c].push(b);
    });
    let html = '';
    const containerOrder = Object.keys(groups).sort();
    containerOrder.forEach(container => {
      html += `<span class="container-group">${container}</span>`;
      html += `<div class="tbl-wrap"><table>
        <thead><tr>
          <th>Rack</th><th>Batch</th><th># Trays Harvested</th><th>Actual Yield (oz total)</th><th></th>
        </tr></thead><tbody>`;
      groups[container].forEach(b => {
        const total    = parseInt(b.number_of_trays)||0;
        const ov       = __harvestOverrides[b.id] || {};
        const harvVal  = ov.trays !== undefined ? ov.trays : (parseInt(b.number_trays_harvested)||0);
        const yieldVal = ov.yield !== undefined ? ov.yield : (parseFloat(b.actual_yield||'') || '');
        const pct      = total > 0 ? Math.min(100, Math.round(harvVal/total*100)) : 0;
        html += `<tr>
          <td>${simplifyRack(b.rack)}</td>
          <td>${b.name||'—'}</td>
          <td>
            <div class="yield-wrap">
              <input class="yield-input" id="hi_trays_${b.id}" type="number" min="0" max="${total}" value="${harvVal}"
                onchange="setHarvestOverride('${b.id}','trays',this.value,${total},'hbar_${b.id}')">
              <span class="yield-of">/ ${total}</span>
              <div class="yield-bar-wrap"><div class="yield-bar" id="hbar_${b.id}" style="width:${pct}%"></div></div>
            </div>
          </td>
          <td>
            <div class="yield-wrap">
              <input class="yield-input yield-oz" id="hi_yield_${b.id}" type="number" min="0" step="0.1"
                value="${yieldVal}" placeholder="0.0"
                onchange="setHarvestOverride('${b.id}','yield',this.value)">
              <span class="yield-of">oz</span>
            </div>
          </td>
          <td><button class="save-btn" id="sbtn_${b.id}" onclick="saveHarvestRow('${b.id}')">Save</button></td>
        </tr>`;
      });
      html += '</tbody></table></div>';
    });
    return html;
  }

  if (!allHarvestToday.length) {
    document.getElementById('harvest-body').innerHTML = '<div class="empty">No harvest batches for this date.</div>';
  } else {
    let h = '';
    if (pendingHarvests.length) {
      h += `<div class="harvest-sub-label pending-lbl">⏳ Pending (${pendingHarvests.length})</div>`;
      h += buildHarvestTable(pendingHarvests);
    }
    if (completedHarvests.length) {
      h += `<div class="harvest-sub-label done-lbl">✅ Completed (${completedHarvests.length})</div>`;
      h += buildHarvestTable(completedHarvests);
    }
    document.getElementById('harvest-body').innerHTML = h;
  }

  // ── LABELS ──
  const totalLbls = labelsToday.length + labelsTmr.length;
  document.getElementById('badge-labels').textContent = totalLbls;
  if (!totalLbls) {
    document.getElementById('labels-body').innerHTML = '<div class="empty">No unprinted labels for this date or next day.</div>';
  } else {
    let lHtml = '';
    [[todayStr, labelsToday],[tmrStr, labelsTmr]].forEach(([ds, items]) => {
      if (!items.length) return;
      const sorted = [...items].sort((a,b) => (a.product_name||'').localeCompare(b.product_name||''));
      lHtml += `<div class="date-group">${ds}</div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Product</th><th>Customer</th><th>Qty</th><th>Oz</th></tr></thead><tbody>`;
      sorted.forEach(l => {
        lHtml += `<tr>
          <td>${l.product_name||'—'}</td>
          <td class="customer-col">${l.client_name||'—'}</td>
          <td>${l.quantity_boxes||0}</td>
          <td>${l.total_ounces||0}</td>
        </tr>`;
      });
      lHtml += '</tbody></table></div>';
    });
    document.getElementById('labels-body').innerHTML = lHtml;
  }

  // ── OZ BY VARIETY (expandable) ──
  if (!ozEntries.length) {
    document.getElementById('oz-body').innerHTML = '<div class="empty">No oz data.</div>';
  } else {
    let oz = `<div class="tbl-wrap"><table>
      <thead><tr><th style="width:30px"></th><th>Variety</th><th>Total Oz Needed</th></tr></thead><tbody>`;
    ozEntries.forEach(([name, data], idx) => {
      const rowId = 'ozrow_' + idx;
      oz += `<tr style="cursor:pointer" onclick="toggleOzRow('${rowId}')">
        <td><span id="chev_${rowId}" style="color:#1a56cc;font-size:0.8rem">▶</span></td>
        <td style="font-weight:600">${name}</td>
        <td class="oz-total">${data.total} oz</td>
      </tr>
      <tr id="${rowId}" style="display:none">
        <td colspan="3" style="padding:0 0 6px 24px;background:#f8f9fc">
          <table style="width:100%;font-size:0.8rem;margin-top:4px">
            <thead><tr>
              <th style="color:#aaa;font-weight:600;padding:4px 8px">Customer</th>
              <th style="color:#aaa;font-weight:600;padding:4px 8px">Product</th>
              <th style="color:#aaa;font-weight:600;padding:4px 8px">Date</th>
              <th style="color:#aaa;font-weight:600;padding:4px 8px">Oz</th>
            </tr></thead>
            <tbody>`;
      data.items.forEach(it => {
        oz += `<tr>
          <td style="padding:3px 8px;color:#444">${it.customer}</td>
          <td style="padding:3px 8px;color:#666">${it.product}</td>
          <td style="padding:3px 8px;color:#999">${it.date}</td>
          <td style="padding:3px 8px;font-weight:600;color:#ea580c">${it.oz} oz</td>
        </tr>`;
      });
      oz += `</tbody></table></td></tr>`;
    });
    document.getElementById('oz-body').innerHTML = oz + '</tbody></table></div>';
  }

  // ── PLANTINGS ──
  document.getElementById('badge-plant').textContent = plantTraySum;
  if (!nonLettuceNonMixForKpi.length) {
    document.getElementById('plant-body').innerHTML = '<div class="empty">No plantings for this date.</div>';
  } else {
    // Sort alphabetically by variety name
    const sortedPlantings = [...nonLettuceNonMixForKpi].sort((a, b) => {
      const nameA = (varMap[a.variety]?.name || a.variety || '').toLowerCase();
      const nameB = (varMap[b.variety]?.name || b.variety || '').toLowerCase();
      return nameA.localeCompare(nameB);
    });
    let p = `<div class="tbl-wrap"><table>
      <thead><tr><th>Batch</th><th>Rack</th><th>Trays</th><th>Status</th><th>Seed Density</th></tr></thead><tbody>`;
    sortedPlantings.forEach(b => {
      const v = varMap[b.variety];
      const seedDensity = v ? (v.sd || '—') : '—';
      const rack = simplifyRack(b.rack);
      const statusTxt = b.status_name || '—';
      p += `<tr>
        <td>${b.name||'—'}</td>
        <td>${rack}</td>
        <td>${b.number_of_trays||'?'}</td>
        <td>${statusPill(statusTxt)}</td>
        <td>${seedDensity}</td>
      </tr>`;
    });
    document.getElementById('plant-body').innerHTML = p + '</tbody></table></div>';
  }

  // ── TOMORROW ──
  document.getElementById('badge-tmr').textContent = tmrOrders.length;
  const sortedTmr = [...tmrOrders].sort((a,b) =>
    (parseInt(a.stop_number)||9999) - (parseInt(b.stop_number)||9999)
  );
  if (!sortedTmr.length) {
    document.getElementById('tomorrow-body').innerHTML = '<div class="empty">No orders for next day.</div>';
  } else {
    let t = `<div class="tbl-wrap"><table>
      <thead><tr>
        <th>Stop #</th><th>Customer</th><th>Product</th>
        <th>Qty</th><th>Oz</th><th>Unit $</th><th>Total $</th><th>Status</th><th>Invoice</th>
      </tr></thead><tbody>`;
    sortedTmr.forEach(ord => {
      const prefs  = clientPrefs[ord.client_name]||{};
      const invTxt = prefs.bring_invoice === 'Y'
        ? '<span class="inv-yes">Yes</span>' : '<span class="inv-no">No</span>';
      const stopCell = ord.stop_number ? `<span class="stop-num">${ord.stop_number}</span>` : '—';
      const items = tmrDetails.filter(d => d.order === ord.id);
      let stopTotal = 0;
      if (!items.length) {
        t += `<tr><td>${stopCell}</td><td>${ord.client_name}</td>
          <td colspan="5" class="empty">No items</td>
          <td>${statusPill(ord.status)}</td><td>${invTxt}</td></tr>`;
      } else {
        items.forEach((it, i) => {
          const lt = parseFloat(it.total_price)||0; stopTotal += lt;
          t += `<tr>
            <td>${i===0?stopCell:''}</td>
            <td class="customer-col" style="font-weight:${i===0?'600':'400'};color:${i===0?'#333':'#bbb'}">${i===0?ord.client_name:''}</td>
            <td>${it.product_name||'—'}</td>
            <td><span class="qty-badge">${it.quantity_boxes||0}</span></td>
            <td>${it.total_ounces||0}</td>
            <td>${it.unit_price?'$'+parseFloat(it.unit_price).toFixed(2):'—'}</td>
            <td>${lt?'$'+lt.toFixed(2):'—'}</td>
            <td>${i===0?statusPill(ord.status):''}</td>
            <td>${i===0?invTxt:''}</td>
          </tr>`;
        });
        if (stopTotal>0) {
          t += `<tr class="subtotal-row">
            <td colspan="6" style="text-align:right">Stop subtotal</td>
            <td class="subtotal-val">$${stopTotal.toFixed(2)}</td>
            <td colspan="2"></td>
          </tr>`;
        }
      }
    });
    document.getElementById('tomorrow-body').innerHTML = t + '</tbody></table></div>';
  }

  // Re-apply active filter if set
  if (activeFilter) {
    const targets = activeFilter.split(',');
    ALL_SECTIONS.forEach(id => {
      document.getElementById(id).style.display = targets.includes(id) ? 'block' : 'none';
    });
  }
}

function toggleCancelled() {
  const body = document.getElementById('cancelledBody');
  const chev = document.getElementById('cancelChevron');
  if (!body) return;
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  if (chev) chev.textContent = open ? '▼' : '▶';
}

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Loading…';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('warnBadge').style.display = 'none';

  try {
    const [sliceAll, ordersAll, detailAll, batchAll, varietyAll, clientAll] = await Promise.all([
      appFetch(ORDERS, 'labels to print upcoming week only'),
      appFetch(ORDERS, 'order'),
      appFetch(ORDERS, 'order_detail'),
      appFetch(GC,     'batch'),
      appFetch(GR,     'variety'),
      appFetch(ORDERS, 'client')
    ]);

    const varMap = {};
    varietyAll.forEach(v => { varMap[v.id] = v; });

    const clientPrefs = {};
    clientAll.forEach(c => {
      if (c.account_name?.trim())
        clientPrefs[c.account_name.trim()] = { bring_invoice: (c['bring_invoice?']||'N').trim() };
    });

    const orderMap = {};
    ordersAll.forEach(o => { if (o.id) orderMap[o.id] = o; });
    // Enrich both detailAll and sliceAll (labels) with client_name from order
    [detailAll, sliceAll].forEach(arr => {
      arr.forEach(d => {
        if (!d.client_name && d.order && orderMap[d.order])
          d.client_name = orderMap[d.order].client_name || '';
      });
    });

    __store = { sliceAll, ordersAll, detailAll, batchAll, varMap, clientPrefs, orderMap };

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display  = 'block';
    renderForDate(__viewDate);

  } catch(err) {
    if (__store) {
      // have cached data — show warning and re-render with what we have
      document.getElementById('warnBadge').style.display = 'inline-block';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display  = 'block';
      renderForDate(__viewDate);
    } else {
      const errEl = document.getElementById('error-msg');
      errEl.textContent = '⚠️ ' + err.message;
      errEl.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display  = 'block';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '⚡ Refresh';
    btn.innerHTML = '⚡ Refresh';
  }
}

loadData();
</script>
</body>
</html>
